# Runs the offline test suite on real Linux, macOS and Windows machines on every upload,
# with the oldest Node.js that Frenemy supports and a current one.
# It needs Node.js only. It makes no calls to any AI provider and needs no accounts or secrets.
name: check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-suite:
    strategy:
      fail-fast: false
      matrix:
        # A commit message containing [no-mac] leaves the Mac machines out (they cost the most per minute).
        os: ${{ fromJSON(contains(github.event.head_commit.message, '[no-mac]') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        node: ['18', '22']
    runs-on: ${{ matrix.os }}
    steps:
      # The download check compares every file byte for byte, so git must not rewrite line endings.
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check the download and the prerequisites
        run: node install.mjs --check
      - name: Offline test suite (includes the installer tests)
        run: node tools/check-release.mjs --skip-browser
